name: Publish to npm

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump type"
        required: true
        default: "patch"
        type: choice
        options:
          - patch
          - minor
          - major

# Workflow-level: bump job needs contents:write to push the release commit + tag.
permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      # fetch-depth: 0 and fetch-tags are required, not cosmetic: `changelog:roll
      # --auto-draft` ranges over `git log <last-tag>..HEAD`, and the default shallow
      # checkout has neither the tag nor the commits, so the draft would come out empty and
      # the release would stop. The tag must also exist locally before it can be pushed.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Bump version
        run: npm version ${{ inputs.bump }} --no-git-tag-version

      # Move the [Unreleased] notes into a dated [<version>] section and re-point the
      # [Unreleased] link reference, so the notes shipped inside the tarball describe the
      # version they are shipped with. Rolled here, in the same commit as the bump, so the
      # tag and the CHANGELOG cannot disagree.
      #
      # If [Unreleased] is empty, --auto-draft fills it from the conventional commits since
      # the previous tag, so a release is never blocked on having hand-written the notes
      # first. The result is committed like any other change and can be edited afterwards.
      - name: Roll CHANGELOG
        run: npm run changelog:roll -- --auto-draft

      - name: Verify CHANGELOG describes the release
        run: npm run changelog:check

      - name: Commit, tag and push
        id: tag
        run: |
          VERSION=$(node -p "require('./package.json').version")
          # package-lock.json is included because `npm version` rewrites its version
          # fields; committing only package.json left the lockfile pinned to the previous
          # release on master.
          git add package.json package-lock.json CHANGELOG.md
          git commit -m "release: prepare pi-telegram-plus v${VERSION}"
          git tag "v${VERSION}"
          git push origin HEAD:master
          git push origin "v${VERSION}"
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"

  # Publish runs as a downstream job in the SAME workflow run, so it is NOT
  # affected by the GITHUB_TOKEN "push does not trigger other workflows" rule.
  # (The bump job's tag push uses GITHUB_TOKEN, which would not launch a
  # separate on:push:tags workflow — that was why the old two-workflow setup
  # failed to auto-publish. Inlining publish here fixes it.)
  publish:
    needs: bump
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # required for npm provenance
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.bump.outputs.tag }}

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Verify version matches tag
        env:
          # Use a non-reserved name; the runner's GITHUB_REF_NAME cannot be
          # overridden by step env and would stay "master" (the workflow ref).
          RELEASE_TAG: ${{ needs.bump.outputs.tag }}
        run: |
          TAG_VERSION="${RELEASE_TAG#v}"
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag ${RELEASE_TAG} does not match package.json version ${PKG_VERSION}"
            exit 1
          fi

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      # Fails the release if the CHANGELOG does not describe this version. Redundant with
      # prepublishOnly, but explicit here so the reason is visible in the workflow log.
      # Needs no git history, so this job's shallow checkout is fine.
      - name: Verify CHANGELOG
        run: npm run changelog:check

      # Trusted publishing (OIDC): no token needed. Provenance is generated automatically.
      - name: Publish to npm
        run: npm publish